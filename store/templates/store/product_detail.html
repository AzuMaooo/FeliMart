{% extends 'store/base.html' %}
{% block content %}
<a href="{% url 'product_list' %}" class="btn btn-secondary mb-3">← Back to shop</a>
<div class="card">
    <div class="card-body">
        <h5 class="card-title">{{ product.name }}</h5>
        <span class="badge bg-secondary">{{ product.rarity }}</span>
        <p class="card-text">{{ product.description }}</p>
        <p class="card-text"><strong>${{ product.price }}</strong> — {{ product.category }}</p>
    </div>
</div>
{% endblock %}
