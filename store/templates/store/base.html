<!DOCTYPE html>
<html>
<head>
    <title>FeliMart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand brand-pixel">FeliMart</span>
            <a href="{% url 'shopping_advisor' %}" class="btn btn-outline-light me-2">🐾 Ask Advisor</a>
            <a href="{% url 'view_cart' %}" class="btn btn-outline-light">🛒 Cart</a>
        </div>
    </nav>

    <div class="container">
        {% if messages %}
        <div class="container mt-3">
            {% for message in messages %}
            <div class="alert alert-success fade-out">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}
        {% block content %}
        {% endblock %}
    </div>
    <style>
        .fade-out {
            animation: fadeOut 3s forwards;
            animation-delay: 2s;
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
            }

            to {
                opacity: 0;
            }
        }
        .brand-pixel {
            font-family: 'Press Start 2P', cursive;
            font-size: 1rem;
            letter-spacing: 1px;
            color: #ffd700;
            text-shadow: 2px 2px 0 #000;
            background-color: rgba(0, 0, 0, 0.25);
            padding: 10px 14px;
            border: 3px solid #ffd700;
            box-shadow: 4px 4px 0 #000;
            display: inline-block;
        }
            
        .product-name {
            font-size: 1.5rem;
        }

        .product-name-link {
            font-family: 'Baloo 2', sans-serif;
            font-weight: 800;
            color: #5b3a8e;
            text-decoration: none;
        }

            .product-name-link:hover {
                color: #7a52b8;
            }

        .rarity-badge {
            font-size: 0.68rem;
            padding: 0.3em 0.55em;
            line-height: 1;
            vertical-align: middle;
        }

        .navbar {
            background-color: #1a1a2e !important;
            background-image: linear-gradient(90deg, rgba(255,255,255,0.06) 1px, transparent 1px), linear-gradient(rgba(255,255,255,0.06) 1px, transparent 1px);
            background-size: 6px 6px;
        }

            .navbar .btn-outline-light {
                border-color: rgba(255, 255, 255, 0.75);
                color: #f5f5f5;
            }

                .navbar .btn-outline-light:hover {
                    background-color: rgba(255, 255, 255, 0.15);
                    border-color: #fff;
                }

        .card {
            border-radius: 20px;
            overflow: hidden;
        }
    </style>
</body>
</html>
