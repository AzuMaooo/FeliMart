<!DOCTYPE html>
<html>
<head>
    <title>FeliMart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand">FeliMart</span>
            <a href="{% url 'view_cart' %}" class="btn btn-outline-light">🛒 Cart</a>
        </div>
    </nav>

    <div class="container">
        {% if messages %}
        <div class="container mt-3">
            {% for message in messages %}
            <div class="alert alert-success fade-out">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}
        {% block content %}
        {% endblock %}
    </div>
    <style>
        .fade-out {
            animation: fadeOut 3s forwards;
            animation-delay: 2s;
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
            }

            to {
                opacity: 0;
            }
        }
    </style>
</body>
</html>
