{% extends 'store/base.html' %}
{% block content %}
<h2>Order #{{ order.id }} Confirmation</h2>

<table class="table">
    <thead>
        <tr>
            <th>Product</th>
            <th>Quantity</th>
            <th>Line Total</th>
        </tr>
    </thead>
    <tbody>
        {% for item in order_items %}
        <tr>
            <td>{{ item.product.name }}</td>
            <td>{{ item.quantity }}</td>
            <td>${{ item.total_price }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<h4>Total: ${{ order.total_price }}</h4>

<a href="{% url 'paypal_payment' order.id %}" class="btn btn-primary">Pay with PayPal</a>
{% endblock %}
