{% extends 'store/base.html' %}
{% block content %}
<div class="row">
    {% for product in products %}
    <div class="col-md-4 mb-4">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">
                    <a href="{% url 'product_detail' product.id %}">{{ product.name }}</a>
                </h5>
                <span class="badge bg-secondary">{{ product.rarity }}</span>
                <p class="card-text">{{ product.description }}</p>
                <p class="card-text"><strong>${{ product.price }}</strong> — {{ product.category }}</p>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
